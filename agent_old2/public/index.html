<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <header>
            <h1>Personal Assistant</h1>
            <span class="status" id="status">Ready</span>
        </header>

        <main id="messages"></main>

        <footer>
            <form id="chat-form">
                <input type="text" id="input" placeholder="Ask me anything..." autocomplete="off" autofocus />
                <button type="submit" id="send-btn">Send</button>
            </form>
        </footer>
    </div>

    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const status = document.getElementById('status');
        const sendBtn = document.getElementById('send-btn');

        let isProcessing = false;
        let sessionId = localStorage.getItem('sessionId') || null;

        function setStatus(text, type = 'ready') {
            status.textContent = text;
            status.className = `status ${type}`;
        }

        function addMessage(role, content, isStreaming = false) {
            const div = document.createElement('div');
            div.className = `message ${role}${isStreaming ? ' streaming' : ''}`;

            if (role === 'assistant') {
                div.innerHTML = formatContent(content);
            } else {
                div.textContent = content;
            }

            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        function addToolMessage(name, input, result) {
            const div = document.createElement('div');
            div.className = 'message tool';

            const inputStr = typeof input === 'object' ? JSON.stringify(input, null, 2) : input;

            div.innerHTML = `
        <div class="tool-header">
          <span class="tool-icon">⚡</span>
          <span class="tool-name">${escapeHtml(name)}</span>
        </div>
        <details>
          <summary>Input</summary>
          <pre>${escapeHtml(inputStr)}</pre>
        </details>
        ${result ? `<details open>
          <summary>Output</summary>
          <pre>${escapeHtml(result)}</pre>
        </details>` : '<div class="loading">Running...</div>'}
      `;

            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        function updateToolMessage(div, result) {
            const loading = div.querySelector('.loading');
            if (loading) {
                loading.outerHTML = `<details open>
          <summary>Output</summary>
          <pre>${escapeHtml(result)}</pre>
        </details>`;
            }
        }

        function formatContent(content) {
            // Simple markdown-like formatting
            return escapeHtml(content)
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function sendMessage(text) {
            if (isProcessing || !text.trim()) return;

            isProcessing = true;
            input.disabled = true;
            sendBtn.disabled = true;
            setStatus('Thinking...', 'processing');

            addMessage('user', text);
            input.value = '';

            let assistantDiv = null;
            let assistantText = '';
            let currentToolDiv = null;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, sessionId }),
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;

                        try {
                            const data = JSON.parse(line.slice(6));

                            switch (data.type) {
                                case 'session':
                                    sessionId = data.sessionId;
                                    localStorage.setItem('sessionId', sessionId);
                                    break;

                                case 'text':
                                    if (!assistantDiv) {
                                        assistantDiv = addMessage('assistant', '', true);
                                    }
                                    assistantText += data.content;
                                    assistantDiv.innerHTML = formatContent(assistantText);
                                    assistantDiv.classList.add('streaming');
                                    messages.scrollTop = messages.scrollHeight;
                                    break;

                                case 'tool_start':
                                    setStatus(`Running ${data.name}...`, 'processing');
                                    currentToolDiv = addToolMessage(data.name, data.input);
                                    break;

                                case 'tool_result':
                                    if (currentToolDiv) {
                                        updateToolMessage(currentToolDiv, data.result);
                                        currentToolDiv = null;
                                    }
                                    setStatus('Thinking...', 'processing');
                                    break;

                                case 'error':
                                    addMessage('error', `Error: ${data.error}`);
                                    break;

                                case 'done':
                                    if (assistantDiv) {
                                        assistantDiv.classList.remove('streaming');
                                    }
                                    break;
                            }
                        } catch (e) {
                            // Ignore parse errors for incomplete chunks
                        }
                    }
                }
            } catch (error) {
                addMessage('error', `Connection error: ${error.message}`);
            } finally {
                isProcessing = false;
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
                setStatus('Ready', 'ready');
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            sendMessage(input.value);
        });

        // Handle keyboard shortcuts
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage(input.value);
            }
        });
    </script>
</body>

</html>
